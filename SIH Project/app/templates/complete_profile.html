<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Complete Profile</title>
</head>
<body>

<h1>Complete Your Profile</h1>

<form method="POST">

    <label>GitHub Username:</label><br>
    <input type="text" name="github_username" required><br><br>

    <label>LinkedIn URL:</label><br>
    <input type="url" name="linkedin_url"><br><br>

    <label>Codeforces Username:</label><br>
    <input type="text" name="codeforces_username"><br><br>

    <label>CodeChef Username:</label><br>
    <input type="text" name="codechef_username"><br><br>

    <label>HackerRank Username:</label><br>
    <input type="text" name="hackerrank_username"><br><br>

    <label>Portfolio URL:</label><br>
    <input type="url" name="portfolio_url"><br><br>

    <button type="submit">Save & Sync</button>

</form>

</body>
</html>
